services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: ping-pong-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-secrets:/etc/kafka/secrets
      - kafka-config:/mnt/shared/config
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:16
    container_name: ping-pong-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pong_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: ping-pong-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pong
      MONGO_INITDB_ROOT_PASSWORD: Pong@2026
    volumes:
      - mongodb-data:/data/db
      - mongodb-configdb:/data/configdb

volumes:
  kafka-data:
    name: ping-pong-kafka-data
  kafka-secrets:
    name: ping-pong-kafka-secrets
  kafka-config:
    name: ping-pong-kafka-config
  postgres-data:
    name: ping-pong-postgres-data
  mongodb-data:
    name: ping-pong-mongodb-data
  mongodb-configdb:
    name: ping-pong-mongodb-configdb
